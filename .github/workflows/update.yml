# Holt automatisch neue Handballdaten von nuLiga und speichert sie im Repo.
name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC (deutsche Winterzeit = UTC + 1 Stunde)
    - cron: "17 21 * * 5"     # Freitag  22:17 Uhr
    - cron: "17 22 * * 6"     # Samstag  23:17 Uhr
    - cron: "17 21 * * 0"     # Sonntag  22:17 Uhr
    - cron: "17 16 * * 1"     # Montag   17:17 Uhr (Nachzuegler-Berichte)
  push:                       # neue PDF-Spielberichte oder geaenderte Einstellungen
    paths:
      - "pdf-berichte/**"
      - "config.json"
  workflow_dispatch:          # Knopf "Run workflow" zum Starten von Hand

permissions:
  contents: write

concurrency:                  # nie zwei Abrufe gleichzeitig
  group: datenabruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotheken installieren
        run: pip install -r requirements.txt

      - name: Daten von nuLiga holen
        run: python scraper/abruf.py

      - name: Neue Daten speichern
        run: |
          git config user.name "datenabruf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daten aktualisiert"
          git pull --rebase --autostash
          git push
